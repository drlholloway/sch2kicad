[project]
name = "sch2kicad"
version = "0.1.0"
description = "Turn schematic images and pedal build docs into KiCad 10 schematics"
readme = "README.md"
license = "LicenseRef-PolyForm-Shield-1.0.0"
license-files = ["LICENSE.md", "NOTICE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.9",
    "pillow>=10.0",
    "pypdfium2>=5.0",
]

[project.scripts]
sch2kicad = "sch2kicad.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sch2kicad"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
