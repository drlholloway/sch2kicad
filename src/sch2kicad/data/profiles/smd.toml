# SMD build for JLC assembly, Pedal Division library where it has the part.
# Panel parts (pots, LEDs, switches, pads) stay through-hole.
#
# SOT-23 transistors do NOT share the TO-92 lead order: a board part is
# B-E-C (BJT), D-S-G (JFET) or G-S-D (MOSFET) on pads 1-2-3. The symbol is
# chosen for that order, so pad 1 carries the right net — TH_NPN on a SOT-23
# footprint would swap B and E.

name = "smd"
description = "SMD (JLC assembly), Pedal Division library"

[symbols]
resistor = "2025_PedalDivision_Resistors:SMD_Resistor_0805"
ldr = "2025_PedalDivision_Resistors:LDR"
capacitor = "2025_PedalDivision_Capacitors:SMD_Cap_0805"
capacitor_polarized = "2025_PedalDivision_Capacitors:SMD_Cap_D4"
pot = "2025_PedalDivision_Potentiometers:16mm_Alpha_style"
trimmer = "2025_PedalDivision_Potentiometers:Trim"
diode = "2025_PedalDivision_Diodes:Generic"
schottky = "2025_PedalDivision_Diodes:Generic"     # 1N5817 & co. (the house has one diode symbol)
led = "2025_PedalDivision_Diodes:LED"
npn = "Transistor_BJT:Q_NPN_BEC"
pnp = "Transistor_BJT:Q_PNP_BEC"
njfet = "2025_PedalDivision_Transistors:TH_JFET"      # D-S-G, matches SOT-23 JFETs
nmos = "Transistor_FET:Q_NMOS_GSD"
pmos = "Transistor_FET:Q_PMOS_GSD"
opamp_dual = "2025_PedalDivision_ICs:SMD_Op_amp_Dual"
opamp_quad = "2025_PedalDivision_ICs:SMD_Op_amp_Quad"   # V+ on 4, V- on 11 (TL074/LM324 order)
lm386 = "2025_PedalDivision_ICs:TH_LM386"
switch_spdt = "2025_PedalDivision_Switches:SPDT_Toggle_Sw"
switch_dpdt = "2025_PedalDivision_Switches:DPDT_Toggle_Sw"
switch_2p3t = "2025_PedalDivision_Switches:SW_Rotary_2x3"   # the 16mm mini rotary, on the 2P4T body
# the Xicon 42TM series (42TM018 & co.): pins 1-2-3 one winding, 4-5-6 the other,
# 2 and 5 the centre taps, as Xicon number them; through-hole on either profile
transformer = "2025_PedalDivision_Transformers:TM011-R"

# SOT-23 lead order is fixed by the package, not by the TO-92 part named on
# the source schematic; the report asks you to confirm the SMD substitute.
[package_pinouts]
npn = "BEC"
pnp = "BEC"
njfet = "DSG"
nmos = "GSD"
# every SOT-23 P-MOSFET checked is G-S-D too: AO3401A, BSS84, Si2301CDS, IRLML6402
pmos = "GSD"

# The P-channel JFET the table above does not fix: it has no one SOT-23 order
# to assume, so it is drawn in the order the reading gives.
[pinout_fallbacks]
pjfet = "Device:Q_PJFET_{pinout}"

[named_parts]
TL071 = "Amplifier_Operational:TL071"
CA3140 = "Amplifier_Operational:CA3140"
LM13700 = "sch2kicad:LM13700"    # bias current out of the bottom, not beside the output
# KiCad ships no CD4517; the symbol travels with the project
CD4517 = "sch2kicad:CD4517"
# nor an NE570 compandor or a CD4007 (DOD FX96): drawn the way the datasheets and
# DOD draw them, halves and pairs as units
NE570 = "sch2kicad:NE570"
CD4007 = "sch2kicad:CD4007"
# nor the LM565 PLL (Lastgasp Sick Pitch King Jr.), pinned as TI and Signetics number it
LM565 = "sch2kicad:LM565"
NE565 = "sch2kicad:LM565"
# nor the Belton/Accutronics reverb brick (Aleph Null Troglodyte): a 1x10 socket, as it plugs in
"BTDR-3H" = "sch2kicad:BTDR-3H"
"BTDR-3" = "sch2kicad:BTDR-3H"
# a 4P4T rotary (Shin-ei ME-7): the house symbol, a unit a pole; it carries no
# footprint, since the switch is wired off the board (see [[footprints]])
"4P4T" = "2025_PedalDivision_Switches:SW_Rotary_4x4"
# TI's SOT-23 (DBZ) TL431 is K-REF-A on pads 1-2-3; pins are given by name, so
# the TO-92 reading builds unchanged
TL431 = "Reference_Voltage:TL431DBZ"

# the 4P4T rotary goes off the board: a row of wiring pads, one a lug
[[footprints]]
part = "^4P4T$"
footprint = "Connector_PinHeader_2.54mm:PinHeader_1x20_P2.54mm_Vertical"

[[footprints]]
type = ["diode", "schottky", "zener"]          # small zeners come in SOD-123 too (MMSZ52xx)
footprint = "Diode_SMD:D_SOD-123"

[[footprints]]
type = ["npn", "pnp", "njfet", "pjfet", "nmos", "pmos"]
footprint = "2025_PedalDivision_Transistors:SOT-23"

[[footprints]]
type = "ic"
part = "^TL431"
footprint = "2025_PedalDivision_Transistors:SOT-23"

[[footprints]]
type = "capacitor_polarized"
min_farads = 68e-6
footprint = "2025_PedalDivision_Capacitors:SMD_Cap_D6.3"

[[footprints]]
type = "capacitor"
min_farads = 2.2e-6
footprint = "2025_PedalDivision_Capacitors:SMD_Cap_1206"

# ICs by pin count: DIP-8 op-amps, DIP-14/16 logic and the LM13700
[[footprints]]
type = ["opamp_single", "ic"]
pins = 8
footprint = "Package_SO:SOIC-8_3.9x4.9mm_P1.27mm"

[[footprints]]
type = "ic"
pins = 14
footprint = "2025_PedalDivision_OpAmps:SOIC-14_3.9x8.7mm_P1.27mm"

[[footprints]]
type = "ic"
pins = 16
footprint = "Package_SO:SOIC-16_3.9x9.9mm_P1.27mm"

# An on/off toggle is an SPDT with one throw unused: the house library has no
# SPST, and KiCad's SW_SPST pins 1-2 land on a throw and the middle lug (pad 2,
# the common), so the switch to order is the plain mini SPDT.
[[footprints]]
type = "switch_spst"
footprint = "2025_PedalDivision_Switches:Mini Switch SPDT"

[flags]
GND = "2025_PedalDivision_Flags:GND"
VCC = "2025_PedalDivision_Flags:VCC"
VREF = "2025_PedalDivision_Flags:VREF"
pwr_flag = "power:PWR_FLAG"
other = "2025_PedalDivision_Flags:VCC"

[ports]
array = "2025_PedalDivision_SignalPads:3pdt_Switch_Connectors+Jacks"
# where the drawing shows no jacks, the plain array: the jacks wire to the footswitch
# off the board, as on Lane's Colonel Angus (October 2026)
array_no_jacks = "2025_PedalDivision_SignalPads:3pdt_Switch_Connectors"
array_pins = { IN = "1", GND = "2", SW = "3", OUT = "4", JI = "5", JO = "6" }
aliases = { INPUT = "IN", "IN+" = "IN", OUTPUT = "OUT", "OUT+" = "OUT", CTRL = "SW" }
pad = "2025_PedalDivision_SignalPads:Small_Pad_Round"
power_pad = "2025_PedalDivision_SignalPads:Small_Pad_Square"
# The supply comes in on the house power socket, the way Lane's own boards take it:
# pin 1 (+) to the supply, pin 2 (-) to ground, value POWER. Only the supply
# input itself, named like one (9V, +9V, VCC, POWER...); any other power pad stays a pad.
power_header = "2025_PedalDivision_Headers:Conn_01x02_Socket_Power"
# With no true bypass ("true_bypass": false) the jacks wire straight to the board,
# on the house jack sockets: tip to IN or OUT, the other pin to ground, the way the
# house boards wire them to the 3PDT array's JI and JO pads. Their value is JIN/JOUT.
jacks = { IN = "2025_PedalDivision_Headers:Conn_01x02_Socket_Jack_In", OUT = "2025_PedalDivision_Headers:Conn_01x02_Socket_Jack_Out" }
